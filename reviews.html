<!DOCTYPE html>
<html>

<head>

    <style>
        .container {
            background: black;
            min-height: 100vh;

            background: #222;

            border: 1px solid #555;
        }

        h2,

            color: #c89b3c;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 25px;
            padding: 12px 28px;
            background: linear-gradient(45deg, #c89b3c, #f5d27a);
            color: black;
            text-decoration: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
        }

        .back-btn:hover {
            background: white;
            color: #111;
            transform: scale(1.05);
        }
    </style>

</head>

<body>

            <button onclick="submitReview()" style="

        <!-- Contact Section -->

">

                <p style="
        color:white;

            <div style="

">

                <p style="
        color:white;

    ">

                </p>

                    📧 Contact Email

                <a href="mailto:a6761809@gmail.com" style="

    </div>

    <script>

        let rating = 0;

        function setRating(value) {

            rating = value;

            let stars = document.querySelectorAll("#stars span");

            stars.forEach((star, index) => {
                if (index < value) {
                    star.innerHTML = "⭐";
                } else {
                    star.innerHTML = "☆";
                }
            });
        }

        function submitReview() {

            let name = document.getElementById("name").value;
            let comment = document.getElementById("comment").value;

            if (name === "" || comment === "" || rating === 0) {
                alert("Please fill all details and select rating");
                return;
            }

            let reviewBox = document.createElement("div");

            reviewBox.classList.add("review-box");

            reviewBox.innerHTML = `
        <h3>${"⭐".repeat(rating)} ${name}</h3>
        <p>${comment}</p>
    `;

            document.getElementById("review-list").prepend(reviewBox);

            document.getElementById("name").value = "";
            document.getElementById("comment").value = "";

            rating = 0;

            let stars = document.querySelectorAll("#stars span");

            stars.forEach((star) => {
                star.innerHTML = "☆";
            });
        }

    </script>
